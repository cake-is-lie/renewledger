name: Build and verify
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build RenewLedger.csproj --configuration Release
      - run: dotnet test tests/RenewLedger.Tests --configuration Release
